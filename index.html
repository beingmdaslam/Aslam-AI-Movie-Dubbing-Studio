
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aslam AI Movie Dubbing Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;background:#080d18;
 color:white;font-family:Arial,sans-serif
}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#45dcff}
.subtitle{text-align:center;color:#aaa}
.card{
 background:#141e30;padding:20px;margin-top:20px;
 border-radius:16px;border:1px solid #263751
}
.upload{
 display:block;width:100%;padding:16px;
 background:#08b9dc;color:#00111a;
 border-radius:10px;text-align:center;
 font-weight:bold;cursor:pointer
}
input[type=file]{
 display:block;width:100%;padding:14px;
 background:#25334a;color:white;
 border-radius:10px;margin-top:12px;
}
select,button{
 width:100%;padding:15px;margin-top:14px;
 border:0;border-radius:10px;font-size:16px
}
select{background:#25334a;color:white}
button{
 background:#08b9dc;color:#00111a;
 font-weight:bold
}
video{width:100%;margin-top:15px;border-radius:12px}
.status{text-align:center;color:#49e6a5}
.small{text-align:center;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>🎬 ASLAM AI</h1>
<p class="subtitle">Movie Dubbing Studio</p>

<div class="card">
<h2>📁 Upload Your Movie</h2>
<p>Choose a video from your Android phone.</p>

<label class="upload" for="videoFile">
SELECT VIDEO FROM PHONE
</label>

<input
 type="file"
 id="videoFile"
 accept="video/*"
>

<p id="fileName" class="status">No video selected</p>

<video id="preview" controls playsinline
 style="display:none"></video>
</div>

<div class="card">
<h2>🌍 Dubbing Settings</h2>

<label>Target Language</label>
<select id="language">
<option>Hindi</option>
<option>English</option>
<option>Arabic</option>
<option>Urdu</option>
<option>French</option>
<option>Spanish</option>
<option>German</option>
<option>Chinese</option>
<option>Japanese</option>
<option>Bengali</option>
<option>Turkish</option>
<option>Portuguese</option>
</select>

<label>Video Quality</label>
<select id="quality">
<option>1080p HD</option>
<option>4K Ultra HD</option>
</select>

<button type="button" id="startBtn">START DUBBING</button>
<p class="small" id="message">
AI processing backend is not connected yet.
</p>
</div>
</div>

<script>
const input = document.getElementById("videoFile");
const preview = document.getElementById("preview");
const fileName = document.getElementById("fileName");

input.addEventListener("change", function(){
 const file = input.files && input.files[0];
 if(!file) return;

 if(!file.type.startsWith("video/")){
  fileName.textContent = "Please select a video file.";
  return;
 }

 if(preview.src){
  URL.revokeObjectURL(preview.src);
 }

 preview.src = URL.createObjectURL(file);
 preview.style.display = "block";
 fileName.textContent = "Selected: " + file.name;
});

document.getElementById("startBtn").addEventListener("click", function(){
 if(!input.files || !input.files.length){
  alert("Please select a video first.");
  return;
 }
 alert("Video selected. AI processing backend is not connected yet.");
});
</script>
</body>
</html>
