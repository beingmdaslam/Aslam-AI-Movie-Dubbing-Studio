name: Mobile browser MP4 smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "render.js"
      - "ffmpeg-worker.js"
      - "ffmpeg-constants.js"
      - "ffmpeg-errors.js"
      - "mobile-studio.html"
      - "local-worker/test-mobile-browser.mjs"
      - ".github/workflows/mobile-browser-smoke.yml"
jobs:
  browser-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium headless shell
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --only-shell chromium
      - name: Render dubbed MP4 in Chromium
        run: node local-worker/test-mobile-browser.mjs
