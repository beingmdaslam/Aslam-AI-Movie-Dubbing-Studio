name: Mobile browser MP4 smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "render.js"
      - "ffmpeg-worker.js"
      - "ffmpeg-constants.js"
      - "ffmpeg-errors.js"
      - "mobile-studio.html"
      - "local-worker/test-mobile-browser.mjs"
      - ".github/workflows/mobile-browser-smoke.yml"
jobs:
  browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Create one-second test video
        run: ffmpeg -y -f lavfi -i color=c=black:s=640x360:r=24:d=1 -an -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/aslam-test.mp4"
      - name: Render dubbed MP4 in Chromium
        run: node local-worker/test-mobile-browser.mjs "$RUNNER_TEMP/aslam-test.mp4"
